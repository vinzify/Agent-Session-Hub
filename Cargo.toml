[package]
name = "agent-session-hub"
version = "0.4.0"
edition = "2024"
description = "fzf-powered session browser for Codex CLI, Claude Code, and OpenCode"
license = "MIT"

[[bin]]
name = "agent-session-hub"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2.5"
which = "8.0"
tempfile = "3.15"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
semver = "1.0"
sha2 = "0.10"
flate2 = "1.1"
tar = "0.4"

[target.'cfg(windows)'.dependencies]
zip = { version = "9.3", default-features = false, features = ["deflate-flate2"] }
