name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Validate version and cross-platform CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          python3 -c 'import os,tomllib; assert os.environ["RELEASE_TAG"] == "v" + tomllib.load(open("Cargo.toml","rb"))["package"]["version"]'
          sha=$(git rev-parse HEAD)
          test "$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" --status success --json databaseId --jq 'length')" -gt 0
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive_name: agent-session-hub-x86_64-unknown-linux-gnu.tar.gz
            binary_name: agent-session-hub
            archive_kind: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive_name: agent-session-hub-x86_64-apple-darwin.tar.gz
            binary_name: agent-session-hub
            archive_kind: tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive_name: agent-session-hub-aarch64-apple-darwin.tar.gz
            binary_name: agent-session-hub
            archive_kind: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: agent-session-hub-x86_64-pc-windows-msvc.zip
            binary_name: agent-session-hub.exe
            archive_kind: zip

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/${{ matrix.binary_name }}" dist/
          cp README.md LICENSE CONTRIBUTING.md CHANGELOG.md dist/
          cp -R docs dist/
          tar -czf "${{ matrix.archive_name }}" -C dist .

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/release/${{ matrix.binary_name }}" "dist/${{ matrix.binary_name }}"
          Copy-Item README.md dist/README.md
          Copy-Item LICENSE dist/LICENSE
          Copy-Item CONTRIBUTING.md dist/CONTRIBUTING.md
          Copy-Item CHANGELOG.md dist/CHANGELOG.md
          Copy-Item docs dist/docs -Recurse
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.archive_name }}" -Force

      - name: Upload packaged asset
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.sha }}

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten artifact layout
        run: |
          mkdir -p final-assets
          find release-assets -type f -maxdepth 2 -exec cp {} final-assets/ \;
          ls -l final-assets

      - name: Hash release archives and installers
        run: |
          cp install.sh install.ps1 uninstall.sh uninstall.ps1 final-assets/
          cd final-assets
          sha256sum * > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS

      - name: Publish GitHub release
        # A single publisher hashes the complete platform set and installers.
        # Consumers pin their archive and checksum file to the same release tag.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            final-assets/*
